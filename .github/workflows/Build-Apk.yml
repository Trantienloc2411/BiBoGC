name: Build Flutter APK

on:
  push:
    branches: ["main", "development"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: FrontEnd/bibogc
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > FrontEnd/bibogc/android/app/bibogc-release.jks

      - name: Create key.properties
        run: |
          cat > FrontEnd/bibogc/android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=bibogc-release.jks
          EOF

      - name: Build Release APK
        working-directory: FrontEnd/bibogc
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bibogc-release-apk
          path: FrontEnd/bibogc/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "BiBoGC ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## BiBoGC Android Release ${{ github.ref_name }}

            ### Download
            Download the APK below and install it on your Android device.

            > Enable **Install from unknown sources** in your device settings if prompted.
          files: FrontEnd/bibogc/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-artifacts:
    name: Keep only 2 latest artifacts
    runs-on: ubuntu-latest
    needs: build-apk
    if: always()
    permissions:
      actions: write

    steps:
      - name: Delete old artifacts (keep latest 2)
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'bibogc-release-apk';
            const keepCount = 2;

            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: artifactName,
              per_page: 100,
            });

            // Newest first
            const sorted = data.artifacts.sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at)
            );

            const toDelete = sorted.slice(keepCount);
            if (toDelete.length === 0) {
              console.log(`Only ${sorted.length} artifact(s) found — nothing to delete.`);
              return;
            }

            for (const artifact of toDelete) {
              console.log(`Deleting artifact: ${artifact.name} (id=${artifact.id}, created=${artifact.created_at})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
            console.log(`Deleted ${toDelete.length} old artifact(s). Kept ${keepCount}.`);
